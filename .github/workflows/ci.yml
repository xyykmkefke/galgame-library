name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 版本一致性校验
        run: npm run check-version

      - name: 数据质量校验
        run: npm run check-data

      - name: 浏览器端自动化验收
        run: node scripts/verify.mjs --keep

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: .verify
          if-no-files-found: ignore
